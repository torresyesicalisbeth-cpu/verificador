<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documento</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%); 
            margin: 0;
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            width: 100%; 
            max-width: 420px; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        .status-valid { 
            background-color: #2e8b57; 
            color: white; 
            padding: 14px; 
            text-align: center; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.1em;
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card-section { 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            margin-bottom: 20px; 
            background: #ffffff; 
            overflow: hidden;
        }
        .section-header {
            background-color: #f8fafc;
            padding: 12px 16px;
            font-weight: bold;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95em;
        }
        .section-body {
            padding: 16px;
            color: #475569;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .signer-text {
            font-weight: bold;
            color: #334155;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .qr-container {
            text-align: center;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }
        .csv-code {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e293b;
            margin: 10px 0 15px 0;
            letter-spacing: 0.5px;
        }
        .qr-box {
            background: #ffffff;
            padding: 15px;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        /* Estilo simulado para el QR usando diseño responsivo limpio */
        .qr-placeholder {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            background-image: radial-gradient(#000 65%, transparent 65%);
            background-size: 10px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Estado Válido -->
        <div class="status-valid">
            <span>✔</span> Válido
        </div>

        <!-- Bloque Firmante -->
        <div class="card-section">
            <div class="section-header">Firmante</div>
            <div class="section-body">
                A continuación, se muestra la información relativa a la firma electrónica del documento:
                <div style="margin-top: 12px;"></div>
                <div class="signer-text">FUNDACIÓN UNIVERSITARIA DEL ÁREA ANDINA</div>
                <div class="signer-text">SECRETARÍA GENERAL</div>
                <div style="color: #64748b; margin-top: 8px;">Firmado el: 20/01/2023</div>
            </div>
        </div>

        <!-- Bloque Código Seguro de Verificación -->
        <div class="card-section">
            <div class="section-header" style="text-align: center;">🛡️ Código Seguro de Verificación</div>
            <div class="section-body qr-container">
                <div class="csv-code">hRBNMOoAhQR3GtLA</div>
                <div class="qr-box">
                    <!-- Aquí puedes reemplazar la imagen de abajo por tu código QR real si lo deseas -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=hRBNMOoAhQR3GtLA" alt="QR Verificación" style="display: block; margin: 0 auto; width: 150px; height: 150px;">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
