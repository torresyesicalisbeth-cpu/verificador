<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Validación de Títulos - Areandina</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Barra Institucional Superior */
        header {
            background-color: #002b49;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #e31b23;
        }
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .institution-tag {
            font-size: 12px;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        /* Contenido Principal */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .validation-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: left;
            border-top: 4px solid #002b49;
        }
        .validation-card h1 {
            color: #002b49;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .validation-card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #002b49;
        }
        button {
            background-color: #e31b23;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            background-color: #c5141c;
        }
        /* Pie de página institucional */
        footer {
            background-color: #ffffff;
            color: #666;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            border-top: 1px solid #e1e4e8;
        }
    </style>
</head>
<body>

    <!-- Cabecera Oficial -->
    <header>
        <div class="logo-text">AREANDINA</div>
        <div class="institution-tag">Verificación de Títulos Oficiales</div>
    </header>

    <!-- Caja Central de Consulta -->
    <div class="main-container">
        <div class="validation-card">
            <h1>Portal de Validación Académica</h1>
            <p>Ingrese el número de documento de identidad del graduado para consultar el estado y la autenticidad del título oficial registrado.</p>
            
            <div class="form-group">
                <label for="documento">Número de Documento</label>
                <input type="text" id="documento" placeholder="Ej: 1023456789">
            </div>
            
            <button onclick="buscarValidacion()">Consultar Registro</button>
        </div>
    </div>

    <!-- Pie de Página -->
    <footer>
        &copy; 2026 Sistema de Validación Académica Segura &bull; Todos los derechos reservados.
    </footer>

    <script>
        function buscarValidacion() {
            var numero = document.getElementById("documento").value.trim();
            
            if(numero !== "") {
                // Redirige al archivo del estudiante correspondiente
                window.location.href = numero + ".html";
            } else {
                alert("Por favor, ingrese un número de documento válido para realizar la consulta.");
            }
        }
    </script>

</body>
</html>
